{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card p-4 mx-auto shadow-lg" style="max-width: 420px; animation: fadeIn 0.8s ease;">
    <h3 class="text-center mb-4">🔑 Login to Your Account</h3>

    {% if form.errors %}
        <div class="alert alert-danger text-center">Invalid username or password</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label text-light">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label text-light">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="text-center mt-3">
            <button type="submit" class="btn btn-custom px-4">Login</button>
        </div>
    </form>

    <p class="text-center mt-4 text-light">
        Don’t have an account?
        <a href="{% url 'register' %}" class="text-warning">Create one</a>
    </p>
</div>

<style>
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-15px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
{% endblock %}
