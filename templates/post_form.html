{% extends 'base.html' %}
{% block title %}New Post{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 600px;">
    <h3 class="text-center mb-4">🖋 Create / Edit Post</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-center mt-3">
            <button class="btn btn-custom px-4" type="submit">Save</button>
            <a href="{% url 'post_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
