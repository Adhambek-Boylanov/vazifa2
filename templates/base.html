<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Blog{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4C7EFF, #5ED3F3);
            color: #fff;
            min-height: 100vh;
            margin: 0;
        }
        .navbar {
            background-color: rgba(0,0,0,0.25);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-custom {
            background-color: #FFD43B;
            color: #222;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #fff;
            color: #000;
            transform: translateY(-3px);
        }
        .card {
            background: rgba(255,255,255,0.12);
            border: none;
            backdrop-filter: blur(12px);
            color: #fff;
            transition: 0.3s;
        }
        .card:hover {
            box-shadow: 0 0 15px rgba(255,255,255,0.25);
        }
        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-3 py-2">
    <a class="navbar-brand" href="{% url 'post_list' %}">🌟 My Blog</a>

    <div class="ms-auto">
        {% if user.is_authenticated %}
            <span class="me-3">👋 {{ user.username }}</span>
              <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Logout</button>
              </form>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-sm btn-light me-2">Login</a>
            <a href="{% url 'register' %}" class="btn btn-sm btn-custom">Register</a>
        {% endif %}
    </div>
</nav>

<!-- Messages -->
<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>

<!-- Main content -->
<div class="container py-5">
    {% block content %}
    {% endblock %}
</div>

<footer class="text-light py-3">
    <p>© {{ now|date:"Y" }} My Blog — Created with ❤️ and Django</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
